# Deploys #hero to Cloud Run automatically on every push to main or the v0.1 feature branch, after the tests pass.
# Deployments go only through this workflow (push, or by hand: Actions -> deploy-cloud-run -> "Run workflow"); never deploy to GCP directly from a workstation.
# Auth is keyless (Workload Identity Federation, provider `hero-github` in pool `github`, restricted to this repo).
# The app's secrets live only in GitHub repository secrets: HERO_ANTHROPIC_API_KEY, HERO_ANTHROPIC_WORKSPACE_ID,
# HERO_GOOGLE_MAPS_API_KEY, HERO_ADMIN_PASSWORD, HERO_DATABASE_URL.
name: deploy-cloud-run
on:
  push:
    branches: [main, feature/hero-20261029-1915-v0.1]
    paths-ignore: ["docs/**", "spec/**", "*.md"]
  workflow_dispatch: {}
concurrency: { group: cloud-run, cancel-in-progress: false }
permissions: { contents: read, id-token: write }
env:
  WORKLOAD_IDENTITY_PROVIDER: projects/870371939888/locations/global/workloadIdentityPools/github/providers/hero-github
  DEPLOY_SERVICE_ACCOUNT: github-actions-deployer@ai-agent-boilerplate0.iam.gserviceaccount.com
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # Throwaway values: config requires them to be present; no test spends money (live tests are skipped).
      HERO_ADMIN_PASSWORD: ci-admin-password
      HERO_ANTHROPIC_API_KEY: ci-dummy
      HERO_ANTHROPIC_WORKSPACE_ID: ci-dummy
      HERO_GOOGLE_MAPS_API_KEY: ci-dummy
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Unit + integration tests
        run: uv run pytest tests/unit tests/integration -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and deploy
        env:
          PROJECT: ai-agent-boilerplate0
          REGION: us-central1
          BUCKET: hero-data-ai-agent-boilerplate0
          HERO_ANTHROPIC_API_KEY: ${{ secrets.HERO_ANTHROPIC_API_KEY }}
          HERO_ANTHROPIC_WORKSPACE_ID: ${{ secrets.HERO_ANTHROPIC_WORKSPACE_ID }}
          HERO_GOOGLE_MAPS_API_KEY: ${{ secrets.HERO_GOOGLE_MAPS_API_KEY }}
          HERO_ADMIN_PASSWORD: ${{ secrets.HERO_ADMIN_PASSWORD }}
          HERO_DATABASE_URL: ${{ secrets.HERO_DATABASE_URL }}
        run: ./deploy/cloudrun.sh
      - name: Health check
        run: |
          URL=$(gcloud run services describe hero --region us-central1 --format 'value(status.url)')
          for i in 1 2 3 4 5 6; do curl -fsS -m 60 -o /dev/null "$URL/api/health" && echo healthy && exit 0; sleep 10; done
          echo "health check failed"; exit 1
